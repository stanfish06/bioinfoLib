[project]
name = "bioinfoLib"
version = "0.1.3"
description = "a general library for bioinformatics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ipython<9.0.0",
  "jupyterlab>=4.3.5",
  "matplotlib<3.9",
  "numpy<2.0.0",
  "palantir>=1.3.6",
  "pandas",
  "scanpy[leiden]>=1.11.2",
  "scikit-image>=0.25.1",
  "scikit-misc>=0.5.1",
  "seaborn>=0.13.2",
  "torch",
  "torchvision",
  "cython>=3.0.12",
  "adjusttext>=1.3.0",
  "shapely>=2.1.0",
  "juliacall>=0.9.20",
  "juliapkg>=0.1.16",
  "mudata>=0.3.1",
  "pydantic>=2.11.4",
  "statsmodels==0.14.4",
  "scikit-sparse>=0.4.16 ; sys_platform == 'linux'",
  "umap-learn>=0.5.7",
  "glasbey>=0.3.0",
  "mysql-connector-python>=9.3.0",
  "fuzzywuzzy>=0.18.0",
  "python-levenshtein>=0.27.1",
  "ty>=0.0.1a12",
  "xgboost>=3.0.2",
  "python-dotenv>=1.1.1",
  "rpy2[all]>=3.6.1",
  "pytest>=8.4.0",
  "pip>=25.2",
  "tabulate>=0.9.0",
  "pipdeptree>=2.28.0",
  "rich>=14.0.0",
  "ipywidgets>=8.1.7",
  "pyqt5>=5.15.11",
  "fa2-modified>=0.3.10",
  "pyrefly>=0.36.2",
  "torchdyn>=1.0.6",
  "tensorflow>=2.18.1",
]
# tensorflow does not support py3.13 yet

[project.optional-dependencies]
common = [
  "anndata>=0.12.0",
  "networkx>=3.4.2",
  "huggingface-hub[hf-xet]>=0.35.0",
  "pyvista>=0.44.2",
]
optional = [
  "scarches>=0.5.0",
  "scvi-tools>=1.2.0",
  "harmonypy>=0.0.10",
  "bbknn>=1.6.0",
  "cellrank ; sys_platform == 'linux'",
  "deeptools>=3.5.5 ; sys_platform == 'linux'",
  "pygenometracks>=3.9 ; sys_platform == 'linux'",
  "pytometry",
  "phate>=1.0.11",
]
dev = [
  "modular ; sys_platform == 'linux'"
]
deprecating = [
  # bioformats resolution needs java environment, hand this to mise
  # "python-bioformats>=4.1.0 ; sys_platform == 'linux'",
  "scprep>=1.2.3",
  "magic-impute>=3.0.0",
  "scvelo>=0.3.3",
]

[tool.uv]
package = true                                                  # force install package
conflicts = [[{ extra = "common" }, { extra = "deprecating" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

modular = [
  { index = "modular", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "modular"
url = "https://dl.modular.com/public/nightly/python/simple"
explicit = true

[build-system]
requires = ["setuptools>74.1", "Cython"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.11.4"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["src/bioinfoLib/linearAlgebra/old"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools]
package-dir = { "" = "src" }
package-data = { "bioinfoLib.julia" = ["*.jl"], "bioinfoLib.R" = ["*.R"] }
ext-modules = [
  { name = "bioinfoLib.GP.simulator", sources = [
    "./src/bioinfoLib/GP/simulator.pyx",
  ], optional = true },
  { name = "bioinfoLib.linearAlgebra.gauss_mod2_linbox", sources = [
    "./src/bioinfoLib/linearAlgebra/gauss_mod2_linbox.pyx",
  ], language = "c++", optional = true, libraries = [
    "linbox",
    "givaro",
    "gmp",
    "openblas",
    "ntl",
  ] },
  { name = "bioinfoLib.linearAlgebra.gauss_mod2_m4ri", sources = [
    "./src/bioinfoLib/linearAlgebra/gauss_mod2_m4ri.pyx",
  ], language = "c", optional = true, libraries = [
    "m4ri",
  ] },
]

# explicitly add deeptoolsintervals meta otherwise uv is not functional on windows
# might need to be updated in the future
[[tool.uv.dependency-metadata]]
name = "deeptoolsintervals"
version = "0.1.9"
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/stanfish06/bioinfoLib"
Issues = "https://github.com/stanfish06/bioinfoLib/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
