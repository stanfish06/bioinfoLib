[project]
name = "bioinfoLib"
version = "0.1.0"
description = "a general library for bioinformatics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cellrank>=2.0.6 ; sys_platform == 'linux'",
  "ipython<9.0.0",
  "jupyterlab>=4.3.5",
  "magic-impute>=3.0.0",
  "matplotlib<3.9",
  "numpy<2.0.0",
  "palantir>=1.3.6",
  "pandas<=2.2.0",
  "pyvista>=0.44.2",
  "scanpy[leiden]>=1.11",
  "scikit-image>=0.25.1",
  "scikit-misc>=0.5.1",
  "scvelo>=0.3.3",
  "scvi-tools>=1.3.0",
  "seaborn>=0.13.2",
  "stardist>=0.9.1",
  "torch",
  "torchvision",
  "tensorflow-intel ; sys_platform == 'win32'",
  "tensorflow[and-cuda] ; sys_platform == 'linux'",
  "deeptools>=3.5.5 ; sys_platform == 'linux'",
  "pygenometracks>=3.9 ; sys_platform == 'linux'",
  "optuna>=4.2.1",
  "cellpose[gui]>=3.1.1.1",
  "cython>=3.0.12",
  "fa2-modified>=0.3.10",
  "phate>=1.0.11",
  "scarches>=0.6.1",
  "adjusttext>=1.3.0",
  "pytometry>=0.1.6",
  "shapely>=2.1.0",
  "matplotlib-backend-wezterm>=2.1.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>74.1", "cython"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.11.4",
]

[tool.setuptools]
ext-modules = [
  {name = "bioinfoLib.GP.simulator", sources = ["./src/bioinfoLib/GP/simulator.pyx"]}
]

# explicitly add deeptoolsintervals meta otherwise uv is not functional on windows
# might need to be updated in the future
[[tool.uv.dependency-metadata]]
name = "deeptoolsintervals"
version = "0.1.9"
requires-python = ">=3.7"
dependencies = []
platforms = ["linux"]

[project.urls]
Homepage = "https://github.com/stanfish06/bioinfoLib"
Issues = "https://github.com/stanfish06/bioinfoLib/issues"
