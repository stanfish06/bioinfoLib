[project]
name = "bioinfoENV"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cellrank>=2.0.6 ; sys_platform == 'linux'",
  "jupyterlab>=4.3.5",
  "magic-impute>=3.0.0",
  "numpy>=2.1.3",
  "palantir>=1.3.6",
  "pandas>=2.2.3",
  "scanpy[leiden]>=1.10.4",
  "scvelo>=0.3.3",
  "scvi-tools>=1.2.2.post2",
  "torch",
  "torchvision",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
